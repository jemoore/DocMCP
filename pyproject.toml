[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docmcp"
version = "0.1.0"
description = "MCP server providing semantic document search capabilities"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "chromadb>=1.0.0",
    "sentence-transformers>=3.0.0",
    "pymupdf>=1.25.0",
    "markdown>=3.7",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/docmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

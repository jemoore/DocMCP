services:
  docmcp:
    build: .
    ports:
      - "8808:8808"
    volumes:
      - docmcp-index:/data/index
      # Mount your document directories below (read-only recommended):
      - /mnt/data/Documents/Books/HumbleBundle/code-like-a-pro:/data/docs/documents:ro
      # - /path/to/your/notes:/data/docs/notes:ro
    environment:
      DOCMCP_LOG_LEVEL: INFO
      # Set a token to require `Authorization: Bearer <token>` on all requests.
      # Leave unset only if the port is confined to a trusted network.
      # DOCMCP_AUTH_TOKEN: change-me
    restart: unless-stopped

volumes:
  docmcp-index:
